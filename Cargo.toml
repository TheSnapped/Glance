[package]
name = "glance"
version = "1.0.0"
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/TheSnapped/Glance"
description = "Glance: a lightweight, quick-starting video player for Windows (FFmpeg backend)"

[dependencies]
eframe = { version = "0.31", default-features = false, features = ["glow", "default_fonts"] }
cpal = "0.15"
rfd = "0.15"
ffmpeg-next = { version = "9", default-features = false, features = ["codec", "format", "filter", "software-resampling", "software-scaling"] }
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Media", "Win32_Security", "Win32_System_Registry", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[build-dependencies]
winresource = "0.1"

[profile.dev]
debug = "line-tables-only"
incremental = false

# Decoding in an unoptimised debug build stutters; keep dependencies fast.
[profile.dev.package."*"]
debug = false
opt-level = 2

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
